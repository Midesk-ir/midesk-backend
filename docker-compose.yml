services:
  app:
    build: .
    container_name: midesk-api-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: midesk
      DB_USERNAME: midesk
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis

  nginx:
    image: nginx:1.27-alpine
    container_name: midesk-api-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: midesk-api-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: midesk
      MYSQL_USER: midesk
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - midesk-mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: midesk-api-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - midesk-redis:/data

volumes:
  midesk-mysql:
  midesk-redis:
